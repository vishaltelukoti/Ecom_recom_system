version: "3.9"

services:
  ecommerce-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:latest
    container_name: ecommerce-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s